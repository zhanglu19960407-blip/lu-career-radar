name: Daily Career Radar

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger production radar
        env:
          RADAR_ACCESS_TOKEN: ${{ secrets.RADAR_ACCESS_TOKEN }}
        run: |
          for batch in $(seq 0 39); do
            curl --fail-with-body --retry 2 --max-time 300 \
              -X POST "https://lu-career-radar.vercel.app/api/radar/run" \
              -H "Content-Type: application/json" \
              -H "x-career-radar-token: $RADAR_ACCESS_TOKEN" \
              --data "{\"maxWebCompanies\":150,\"webBatch\":$batch}"
          done
